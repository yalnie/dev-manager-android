name: 'Android Native Build'

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK & Accept Licenses
        run: |
          # Ensure current user has write permissions to ANDROID_HOME
          sudo chown -R $USER:$USER $ANDROID_HOME
          
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi
          
          # Accept all licenses
          yes | $SDKMANAGER --licenses || true

          # Install build-tools and platform-tools
          $SDKMANAGER "build-tools;35.0.0" "platform-tools" || true

          # Try installing platform 37 directly
          echo "Attempting to install platforms;android-37..."
          if ! $SDKMANAGER "platforms;android-37"; then
            echo "platforms;android-37 not directly in remote index; preparing platform 37..."
            $SDKMANAGER "platforms;android-36" || $SDKMANAGER "platforms;android-35" || true
            
            # Use latest stable numeric platform (android-36 or android-35) as base
            BASE_PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-[0-9]* 2>/dev/null | grep -E 'android-[0-9]+$' | sort -V | tail -n 1)
            echo "Selected base platform: $BASE_PLATFORM"
            
            rm -rf "$ANDROID_HOME/platforms/android-37"
            cp -r "$BASE_PLATFORM" "$ANDROID_HOME/platforms/android-37"
            
            if [ -f "$ANDROID_HOME/platforms/android-37/source.properties" ]; then
              sed -i 's/^AndroidVersion.ApiLevel=.*/AndroidVersion.ApiLevel=37/' "$ANDROID_HOME/platforms/android-37/source.properties"
              sed -i 's/^Platform.Version=.*/Platform.Version=37/' "$ANDROID_HOME/platforms/android-37/source.properties"
              sed -i 's/^Pkg.Desc=.*/Pkg.Desc=Android SDK Platform 37/' "$ANDROID_HOME/platforms/android-37/source.properties"
              sed -i 's/^AndroidVersion.CodeName=.*/AndroidVersion.CodeName=/' "$ANDROID_HOME/platforms/android-37/source.properties"
              sed -i '/AndroidVersion.PreviewSdkInt/d' "$ANDROID_HOME/platforms/android-37/source.properties"
              sed -i '/AndroidVersion.BetaVersion/d' "$ANDROID_HOME/platforms/android-37/source.properties"
            fi

            if [ -f "$ANDROID_HOME/platforms/android-37/package.xml" ]; then
              sed -i 's/path="platforms;android-[^"]*"/path="platforms;android-37"/' "$ANDROID_HOME/platforms/android-37/package.xml"
              sed -i 's/<api-level>[0-9]*<\/api-level>/<api-level>37<\/api-level>/g' "$ANDROID_HOME/platforms/android-37/package.xml"
              sed -i 's/Android SDK Platform [0-9]*/Android SDK Platform 37/g' "$ANDROID_HOME/platforms/android-37/package.xml"
            fi
          fi

          echo "Available platforms:"
          ls -la $ANDROID_HOME/platforms/
          echo "android-37 source.properties:"
          cat "$ANDROID_HOME/platforms/android-37/source.properties"
          if [ -f "$ANDROID_HOME/platforms/android-37/package.xml" ]; then
            echo "android-37 package.xml snippet:"
            grep -C 3 "localPackage" "$ANDROID_HOME/platforms/android-37/package.xml" || true
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: webos-dev-manager-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
