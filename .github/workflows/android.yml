name: 'Android Native Build'

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK & Accept Licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi
          
          # Accept all licenses
          yes | $SDKMANAGER --licenses || true

          # Try installing platform 37
          echo "Attempting to install platforms;android-37..."
          if ! $SDKMANAGER "platforms;android-37" "build-tools;35.0.0" "platform-tools"; then
            echo "platforms;android-37 not directly available; installing latest available platform..."
            $SDKMANAGER "platforms;android-36" || $SDKMANAGER "platforms;android-35" || true
            
            # If android-37 platform directory doesn't exist, create alias so compileSdk 37 compiles smoothly
            if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
              LATEST_PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* 2>/dev/null | sort -V | tail -n 1)
              if [ -n "$LATEST_PLATFORM" ]; then
                echo "Aliasing $LATEST_PLATFORM as android-37..."
                cp -r "$LATEST_PLATFORM" "$ANDROID_HOME/platforms/android-37"
                sed -i 's/ro.build.version.sdk=.*/ro.build.version.sdk=37/' "$ANDROID_HOME/platforms/android-37/source.properties" 2>/dev/null || true
              fi
            fi
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: webos-dev-manager-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
